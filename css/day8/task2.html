<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="stylesheet" href="assets/css/task2.css">
</head>
<body>
    <form>
        <table>
            <tr class="lable">
                <td><label for="name">Name:</label></td>
                <td><input type="text" id="name" name="name" required></td>
            </tr>
            <tr>
                <td><label for="age">Email:</label></td>
                <td><input type="email" id="age" name="age" required></td>
            </tr>
            <tr>
                <td><label for="address">Password:</label></td>
                <td><input type="password" id="address" name="address" required></td>
            </tr>
            <tr>
                <td><label for="phone">Phone:</label></td>
                <td><input type="tel" id="phone" name="phone" required></td>
            </tr>
        </table>
    </form>
</body>
</html>
