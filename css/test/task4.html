<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Cards</title>
    <link rel="stylesheet" href="assets/css/task4.css">
</head>
<body>

<h1>Our Employees</h1>

<div class="container">

    <div class="card">
        <img src="https://randomuser.me/api/portraits/men/1.jpg" alt="Employee">
        <h3>John Smith</h3>
        <p><strong>Department:</strong> HR</p>
        <p>Email: john@example.com</p>
    </div>

    <div class="card">
        <img src="https://randomuser.me/api/portraits/women/2.jpg" alt="Employee">
        <h3>Emma Johnson</h3>
        <p><strong>Department:</strong> IT</p>
        <p>Email: emma@example.com</p>
    </div>

    <div class="card">
        <img src="https://randomuser.me/api/portraits/men/3.jpg" alt="Employee">
        <h3>David Wilson</h3>
        <p><strong>Department:</strong> Finance</p>
        <p>Email: david@example.com</p>
    </div>

    <div class="card">
        <img src="https://randomuser.me/api/portraits/women/4.jpg" alt="Employee">
        <h3>Sophia Brown</h3>
        <p><strong>Department:</strong> Marketing</p>
        <p>Email: sophia@example.com</p>
    </div>

</div>

</body>
</html>
