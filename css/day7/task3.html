<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/task3.css">
</head>
<body>

    <h1>Product Grid</h1>

    <div class="products">

        <div class="card">
            <img src="assets/css/img/31-images.jpg" alt="Product 1">
            <h3>Headphones</h3>
            <p>₹1,999</p>
        </div>

        <div class="card">
            <img src="assets/css/img/32-images.jpg" alt="Product 2">
            <h3>Smart Watch</h3>
            <p>₹2,499</p>
        </div>

        <div class="card">
            <img src="assets/css/img/33-images.jpg" alt="Product 3">
            <h3>Laptop</h3>
            <p>₹55,000</p>
        </div>

        <div class="card">
            <img src="assets/css/img/34-images.jpg" alt="Product 4">
            <h3>Mobile Phone</h3>
            <p>₹18,999</p>
        </div>

        <div class="card">
            <img src="assets/css/img/35-images.jpg" alt="Product 5">
            <h3>Camera</h3>
            <p>₹35,999</p>
        </div>

        <div class="card">
            <img src="assets/css/img/36-images.jpg" alt="Product 6">
            <h3>Bluetooth Speaker</h3>
            <p>₹2,199</p>
        </div>

        <div class="card">
            <img src="assets/css/img/37-images.jpg" alt="Product 7">
            <h3>Keyboard</h3>
            <p>₹999</p>
        </div>

        <div class="card">
            <img src="assets/css/img/38-images.jpg" alt="Product 8">
            <h3>Mouse</h3>
            <p>₹799</p>
        </div>

    </div>

</body>
</html>
