<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPLE FOR LOOP</title>
</head>
<body>
    <script>

        // TASK1

        for(i=1;i<=10;i++){
            console.log(i);
        }

        // task2

         for(i=10;i>=1;i--){
            console.log(i);
        }

        // TASK3

          for(let i=1;i<=20;i++){
            console.log(i);
        }  
        
        // TASK4

        for(let i=1;i<=20;i++){
            if(i%2==0){
                console.log(i+" is even");
                
            }
        }

        // TASK5

        for(let i=1;i<=20;i++){
            if(i%2!=0){
                console.log(i+" is odd");
                
            }
        }
    </script>
</body>
</html>
