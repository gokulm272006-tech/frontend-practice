<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Manual Push Without push()</title>
</head>
<body>
    <script>
        let array = [10,20,30];
        let newElement = 40;
        for (let i = array.length; i >= 0; i--) {
           array[3] = newElement;
        }
        
        console.log(array);
    </script>
</body>
</html>
