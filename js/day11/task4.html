<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift and Unshift</title>
</head>
<body>
    <script>
        let array = [1, 2, 3, 4, 5];
        array.unshift(0);
        array.shift();
        console.log(array);
    </script>
</body>
</html>
