<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Closure Counter</title>
</head>
<body>
    <script>
        let createCounter = () => {
            let count = 0;
            return () => {
                count++;
                console.log(count);
            };
        };

        let counter = createCounter();
        counter(); 
        counter(); 
        counter(); 
    </script>
</body>
</html>
