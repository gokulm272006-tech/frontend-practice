<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Arrow Function</title>
</head>
<body>
    <script>
       
        let factorial=(a)=>{
             let f=1;
            for(let i=1; i<=a;i++){
               f=i*f 
            }
            return f;
        }
        
        console.log(factorial(5))
    </script>
</body>
</html>
