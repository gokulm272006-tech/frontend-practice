<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Reverse String</title>
</head>
<body>
    <script>
        let text = "javascript";
        let res="";
        for(let i=text.length-1; i>=0; i--){
             res=res+text[i] ;
        }
        console.log(res);
    </script>
</body>
</html>
