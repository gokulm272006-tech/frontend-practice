<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Through Array </title>
</head>

<body>
    <script>

        // task 1

        let a = [1, 2, 3, 4, 5];
        for (let i = 0; i < a.length; i++) {
            console.log(a[i]);

        }


        //  task 2

        let name = ["goku", "sandy", "tommy", "browny"];
        for (let i = 0; i < name.length; i++) {
            console.log(name[i]);
        }

        // task 3

        let number = [22, 23, 43, 43, 5, 332];
        for (let i = 0; i < number.length; i++) {
            if (number[i] % 2 == 0) {
                console.log(number[i]);
            }

        }

        // task 4

        let students = [
            { name: "Gokul", mark: 85 },
            { name: "Sandy", mark: 95 },
            { name: "Tommy", mark: 90 },
            { name: "Arun", mark: 65 },
            { name: "Kumar", mark: 52 }
        ];

        for (let i = 0; i < students.length; i++) {
            if (students[i].mark > 80) {
                console.log(students[i].name);
            }
        }
    </script>
</body>

</html>
