<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forEach()</title>
</head>
<body>
    <script>
        let students = ['John', 'Jane', 'Jim', 'Jill', 'Jack'];
        students.forEach((students,index) => {
            console.log((index + 1) + '. ' + students);
        });
    </script>
</body>
</html>
